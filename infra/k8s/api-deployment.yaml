apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-api
  labels:
    app: synapse-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: synapse-api
  template:
    metadata:
      labels:
        app: synapse-api
    spec:
      containers:
        - name: api
          image: synapseorchai/synapse-ai-api-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8765
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: synapse-secrets
                  key: redis-url
            - name: SCALE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: synapse-secrets
                  key: postgres-url
            # The engine's own database. Same secret as SCALE_POSTGRES_URL, so
            # the API and every worker read one store, which is what lets any
            # process serve any job.
            - name: SYNAPSE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: synapse-secrets
                  key: postgres-url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 10
      # No volumes. There was a single ReadWriteMany PVC mounted at /data on the
      # API and on every worker — one shared filesystem holding config, the
      # vault and run state, which is the assumption that made a pod unable to
      # serve a job another pod started. Documents are in Postgres and tenant
      # content is in S3 (the S3_* variables); anything left on local disk is
      # rebuildable and belongs to its own replica.
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-api
spec:
  selector:
    app: synapse-api
  ports:
    - port: 8765
      targetPort: 8765
---
# HPA scales API servers based on CPU (I/O-bound — CPU HPA is appropriate here)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synapse-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synapse-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
