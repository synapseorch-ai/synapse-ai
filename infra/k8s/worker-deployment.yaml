apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-worker
  labels:
    app: synapse-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapse-worker
  template:
    metadata:
      labels:
        app: synapse-worker
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: synapseorchai/synapse-ai-worker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
              name: health
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: synapse-secrets
                  key: redis-url
            - name: SCALE_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: synapse-secrets
                  key: postgres-url
            - name: WORKER_CONCURRENCY
              value: "20"
            - name: WORKER_JOB_TIMEOUT
              value: "3600"
            - name: WORKER_HEALTH_PORT
              value: "9000"
            # The engine's own database — the same one the API writes.
            - name: SYNAPSE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: synapse-secrets
                  key: postgres-url
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
      # No volumes — see the note in api-deployment.yaml. A worker holds no
      # install of its own: its documents are in Postgres and the tenant content
      # it reads and writes is in S3.
---
# Service for health checks
apiVersion: v1
kind: Service
metadata:
  name: synapse-worker
  labels:
    app: synapse-worker
spec:
  selector:
    app: synapse-worker
  ports:
    - name: health
      port: 9000
      targetPort: 9000
