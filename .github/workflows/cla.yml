# Asks every outside pull request to sign the Contributor License Agreement (CLA.md) and records each signature.
#
# Why pull_request_target: a pull request from a fork gets no write token under `pull_request`, and the bot needs one
# to comment, set its status and record the signature. pull_request_target runs this file as it is on the base
# branch, with the base repository's token. That is safe only because this job never checks out or runs the pull
# request's code: never add an actions/checkout of the pull request's head here.
#
# Signatures are committed to the `cla-signatures` branch of this repository, which the default branch's rules don't
# cover, so the job needs contents: write and no personal token. If CLA.md's text changes, move path-to-signatures to
# a new version folder (signatures/v2/...) so everyone is asked to sign the new text.
#
# The action is pinned to the full commit of release v2.6.1, not a tag, because it runs with a token that can write.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/synapseorch-ai/synapse-ai/blob/master/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: naveenraj-17,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for this pull request. Before we can merge it, we ask each contributor to sign our
            [Contributor License Agreement](https://github.com/synapseorch-ai/synapse-ai/blob/master/CLA.md), once.
            In short: you keep your copyright, you let us use your contribution in this AGPL project and in
            SynapseOrch Cloud, and we promise it stays available as open source. To sign, reply with the comment below.
          custom-allsigned-prcomment: Everyone on this pull request has signed the CLA. Thank you.
