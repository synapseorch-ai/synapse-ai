name: Nightly (stress + integration)

# The slow suites that are excluded from the deploy gate:
#   * stress        — many concurrent chats/orchestrations + SSE under the 5-90s
#                     fake-LLM latency profile; publishes a latency report.
#   * integration   — V2 end-to-end against real Redis + Postgres.
#   * compose-smoke — real docker-compose bring-up (backend + frontend) with a
#                     live health check — the true "does it install & run" test.
#   * npm-e2e       — full npm global install + `synapse` bootstrap (venv + deps).
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt

      - name: Run stress suite (5-90s fake-LLM latency)
        env:
          SYNAPSE_STRESS_REPORT_DIR: ${{ github.workspace }}/stress-reports
          SYNAPSE_STRESS_TOTAL: '40'
          SYNAPSE_STRESS_CONCURRENCY: '20'
        run: |
          python -m pytest backend/tests/stress -m stress -v

      - name: Publish stress report to job summary
        if: always()
        run: |
          if [ -f stress-reports/stress_report.md ]; then
            cat stress-reports/stress_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report
          path: stress-reports/
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synapse
          POSTGRES_PASSWORD: synapse
          POSTGRES_DB: synapse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synapse" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt
          pip install -r backend/requirements-worker.txt

      - name: Run V2 integration suite
        env:
          SYNAPSE_TEST_REDIS_URL: redis://localhost:6379
          SYNAPSE_TEST_POSTGRES_URL: postgresql+asyncpg://synapse:synapse@localhost:5432/synapse
        run: |
          python -m pytest backend/tests/integration -m integration -v

  # Real docker-compose bring-up (standalone profile): build both images, wait
  # for the backend to serve, then tear down. The true end-to-end install test.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide a .env file for compose (git-ignored)
        # Use the Docker template — it pins the container-internal backend port to
        # 8765 (matching the healthcheck and frontend). .env.example targets the
        # native path and uses a different port, which leaves the backend serving
        # on the wrong port and the healthcheck failing.
        run: cp .env.docker .env 2>/dev/null || touch .env
      - name: Bring up the standalone stack
        run: docker compose up -d --build backend frontend
      - name: Wait for the backend to serve
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8765/openapi.json >/dev/null 2>&1; then
              echo "backend healthy"; ok=1; break
            fi
            sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::backend never came up"; docker compose logs; exit 1; }
      - name: Check the frontend responds
        run: curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" http://localhost:3000 || true
      - name: Logs + teardown
        if: always()
        run: |
          docker compose logs --tail 80 || true
          docker compose down -v || true

  # Full npm path: global install, then `synapse` bootstraps a venv + installs
  # backend deps (heavy — hence nightly, not per-PR).
  npm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pack + global install
        run: |
          npm run build
          npm pack
          npm install -g ./synapse-orch-ai-*.tgz
      - name: The first run installs Synapse through the bundled installer
        run: |
          # The package's version is not on PyPI until release day, so the
          # wheel comes from this checkout.
          pip install build && python -m build --wheel --outdir dist
          SYNAPSE_PACKAGE="$(ls $PWD/dist/*.whl)" SYNAPSE_YES=1 timeout 1200 synapse status --json
          test -f "$HOME/.synapse/install.json"

  # ── dependency drift (early warning) ────────────────────────────────────────
  # The gate installs backend/requirements.lock, which is exactly the point: users
  # get a tested environment. The cost is that CI stops noticing what upstream is
  # doing. This job deliberately resolves requirements*.txt UNPINNED and runs the
  # MCP boot tests against it.
  #
  # This is the job that would have caught mcp 2.0.0 the day it was published,
  # instead of a user discovering it on a fresh install: the SDK removed the
  # lowlevel Server decorator API and every native tool server stopped loading.
  #
  # A failure here is not a broken PR — it means "upstream shipped something that
  # breaks us; the cap is holding, go investigate before raising it."
  dependency-drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve dependencies unpinned (ignore the lock)
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r backend/requirements.txt -r backend/requirements-coding.txt
          pip install -r backend/requirements-test.txt

      - name: Report what actually resolved
        run: pip freeze | sort

      - name: Boot every MCP tool server + check the SDK contract
        run: |
          python -m pytest \
            backend/tests/install/test_mcp_tool_servers.py \
            backend/tests/install/test_mcp_sdk_contract.py \
            -v -ra

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Dependency drift detected — Python ${{ matrix.python-version }}"
            echo ""
            echo "Resolving \`backend/requirements.txt\` without the lockfile produced an"
            echo "environment that fails the MCP boot tests."
            echo ""
            echo "Users are **not** broken: installers resolve \`backend/requirements.lock\`."
            echo "This is the early warning that an upstream release is incompatible."
            echo ""
            echo "Check the \`pip freeze\` output above for what moved, then either add an"
            echo "upper bound in requirements.txt or do the migration."
          } >> "$GITHUB_STEP_SUMMARY"
