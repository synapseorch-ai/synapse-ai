name: CI

# Fast backend test suite + install smoke. Runs on every PR and every push to
# main. The same suite hard-blocks releases via .github/workflows/publish.yml.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    # 3.11 is the reference version and hard-gates. 3.12/3.13/3.14 still run and
    # report, but don't block the PR — a transitive dependency may not yet ship
    # wheels for the newest interpreter (that's a dep issue, not a test failure).
    continue-on-error: ${{ matrix.python-version != '3.11' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install from the lockfiles so the gate tests exactly what users get.
      # Drift against the unpinned spec is caught by the dependency-drift job in
      # nightly.yml, which deliberately resolves latest and runs the MCP boot
      # tests — that's the early warning, this is the protection.
      # The same four locks as publish.yml's gate (F1468): the worker, telemetry and
      # messaging extras are part of 2.0 (the images and `synapse upgrade --with`
      # install them), and their tests fail rather than skip without them.
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock -r backend/requirements-worker.lock \
            -r backend/requirements-telemetry.lock -r backend/requirements-messaging.lock
          pip install -r backend/requirements-test.txt

      # Code steps run in this image (core/execution/docker_runner.py), and the tests
      # that run one need it, as on a person's machine and on the publish gate.
      - name: Build the code-step sandbox
        run: docker build -q -t sandbox-python:latest -f backend/tools/sandbox.Dockerfile backend/tools

      - name: Run fast test suite (the deploy gate)
        # addopts in pyproject.toml already excludes -m stress and -m integration.
        run: |
          python -m pytest \
            --html=report.html --self-contained-html \
            --cov=core --cov-report=xml --cov-report=html --cov-report=term-missing \
            --cov-fail-under=50 \
            --junitxml=junit.xml

      - name: Test summary
        if: always()
        run: |
          {
            echo "## Backend tests — Python ${{ matrix.python-version }}"
            if [ -f coverage.xml ]; then
              cov=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate',0))*100,1))")
              echo ""
              echo "**Line coverage: ${cov}%**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            report.html
            htmlcov/
            coverage.xml
            junit.xml
          if-no-files-found: ignore

  # ── lockfile freshness ──────────────────────────────────────────────────────
  # backend/requirements.lock is what installers and the gate above resolve, so
  # a lock that no longer matches requirements*.txt means CI is testing an
  # environment users won't get. Cheap, matrix-independent, so it runs once.
  lockfile-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # The uv lock-deps.sh requires (UV_VERSION there): another writes markers differently (F1170).
          version: "0.11.8"
      - name: Locks match requirements*.txt
        run: ./scripts/lock-deps.sh --check

  # Installation validation (pip/npm/docker-compose/setup scripts) lives in a
  # dedicated workflow: .github/workflows/install.yml
