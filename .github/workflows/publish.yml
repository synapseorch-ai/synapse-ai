name: Publish Synapse

on:
  push:
    tags:
      - 'v*'
  # Escape hatch for a half-failed release: publish-docker builds three images, and
  # when one fails the other two are already on Docker Hub, so re-tagging is not an
  # option. Re-running the failed run does not help either — it replays the workflow
  # file from the tagged commit. Dispatching runs the current file from master while
  # `ref` selects the source to build.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)publish, e.g. 1.8.4'
        required: true
      ref:
        description: 'Git ref to build from (e.g. v1.8.4). Defaults to the selected branch.'
        required: false
      images:
        description: 'Which images to publish'
        default: all
        type: choice
        options: [all, combined, worker, api-server]

jobs:
  # ── Deploy gate ────────────────────────────────────────────────────────────
  # Runs the fast backend test suite + install checks + version/tag consistency.
  # Every publish job below `needs: gate`, so a single failing test aborts the
  # entire release to PyPI, npm, and Docker Hub.
  gate:
    runs-on: ubuntu-latest
    # What this tag publishes (scripts/release_version.py, F827): the version in
    # PyPI's and npm's spelling, and whether it is a pre-release — which must not
    # take npm `latest`, Docker `:latest` or GitHub's releases/latest.
    outputs:
      pep440: ${{ steps.rv.outputs.pep440 }}
      npm: ${{ steps.rv.outputs.npm }}
      docker: ${{ steps.rv.outputs.docker }}
      prerelease: ${{ steps.rv.outputs.prerelease }}
      npm_tag: ${{ steps.rv.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Install from the lockfiles: the release gate must validate exactly the
      # dependency set the released artifacts will install. The worker, telemetry
      # and messaging locks are part of it (the images and `synapse upgrade --with`
      # install them), and their tests fail rather than skip without them: v2.0.0-rc1's
      # first gate stopped on 36 failures, every one a missing extra or the sandbox below.
      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock -r backend/requirements-worker.lock \
            -r backend/requirements-telemetry.lock -r backend/requirements-messaging.lock
          pip install -r backend/requirements-test.txt

      # Code steps run in this image (core/execution/docker_runner.py), and the tests
      # that run one need it, as on a person's machine.
      - name: Build the code-step sandbox
        run: docker build -q -t sandbox-python:latest -f backend/tools/sandbox.Dockerfile backend/tools

      - name: Verify version matches the release tag
        id: rv
        run: |
          # On workflow_dispatch GITHUB_REF_NAME is a branch, so take the version from
          # the input instead — that is the version actually being published.
          python scripts/release_version.py "${{ inputs.version || github.ref_name }}" > release-version.txt
          cat release-version.txt
          cat release-version.txt >> "$GITHUB_OUTPUT"

      - name: Run gate test suite
        run: |
          python -m pytest --junitxml=junit.xml -ra

      - name: Upload gate test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-junit
          path: junit.xml
          if-no-files-found: ignore

  # PyPI/npm/frontend only run for a real tag push. workflow_dispatch exists to repair
  # a failed *image* publish, and neither registry can be republished at the same
  # version anyway — `npm publish` rejects it outright, and twine needs --skip-existing.
  # publish-docker does not need this job: the combined Dockerfile builds the frontend
  # in its own stage.
  build-frontend:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Next.js standalone
        run: bash scripts/build_frontend.sh

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          include-hidden-files: true
          path: |
            synapse/_frontend

  publish-python:
    runs-on: ubuntu-latest
    needs: [gate, build-frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-builds

      - name: Build Python package
        run: |
          pip install hatch
          hatch build

      - name: Verify the built wheel installs and the CLI runs
        # Gate the ACTUAL artifact before it reaches PyPI, with the dependencies it
        # declares, as `pip install synapse-orch-ai` gets them: 2.0's CLI imports
        # rich (synapse/client/commands.py) before it can print --help, so a
        # --no-deps install stopped v2.0.0-rc1's PyPI publish on No module named 'rich'.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --upgrade pip
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/synapse --help
          /tmp/verify/bin/python -c "import synapse.cli; assert callable(synapse.cli.main)"

      - name: Publish to PyPI
        run: |
          pip install twine
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: [gate, build-frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify the package before publish
        run: |
          npm run build
          npm pack
          tgz=$(ls synapse-orch-ai-*.tgz)
          for f in package/bin/synapse.js package/installer/synapse-install.pyz; do
            tar tzf "$tgz" | grep -qx "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Publish to npm
        # A pre-release goes under `next`: `npm install -g synapse-orch-ai` keeps
        # installing the last final release. A version npm already has is left as it
        # is (npm refuses to publish over one), so a tag re-pushed after a later job
        # failed still reaches PyPI and the GitHub release.
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "synapse-orch-ai@$V" version 2>/dev/null | grep -qx "$V"; then
            echo "npm already has synapse-orch-ai@$V: not published again"
          else
            npm publish --access public --tag ${{ needs.gate.outputs.npm_tag }}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The GitHub release carries the installer (synapse-install.pyz and its
  # sha256) and both scripts; the README's install command and setup.sh fetch
  # them from `releases/latest`. So does 1.x's `synapse upgrade` (its source
  # tarball), and the installer it then runs installs this version from PyPI —
  # which is why the release is made only once PyPI serves the version: marked
  # latest a minute early, every 1.x upgrade in that minute fails.
  github-release:
    needs: [gate, publish-python, publish-npm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait until PyPI serves this version
        # Under PyPI's own spelling: tag v2.0.0-rc1 is 2.0.0rc1 there.
        run: |
          V="${{ needs.gate.outputs.pep440 }}"
          for i in $(seq 1 60); do
            if curl -fsS "https://pypi.org/pypi/synapse-orch-ai/${{ needs.gate.outputs.pep440 }}/json" >/dev/null; then
              echo "PyPI serves $V"; exit 0
            fi
            sleep 20
          done
          echo "::error::PyPI does not serve $V after 20 minutes"; exit 1

      - name: Build the installer for this version
        run: python scripts/build_installer.py --out dist --version "${{ needs.gate.outputs.pep440 }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          files="dist/synapse-install.pyz dist/synapse-install.pyz.sha256 setup.sh setup.ps1"
          # A pre-release never becomes releases/latest, which 1.x's `synapse upgrade`
          # and both setup scripts follow; it is installed by its own release's links.
          if [ "$PRERELEASE" = "true" ]; then kind=--prerelease; else kind=--latest; fi
          # Both scripts fetch the installer from releases/latest, which a pre-release never becomes: the copies a
          # pre-release carries are stamped with its own release (the repo's files stay as they are).
          if [ "$PRERELEASE" = "true" ]; then
            sed -i "s#releases/latest/download#releases/download/$GITHUB_REF_NAME#g" setup.sh setup.ps1
          fi
          # The release's text is its notes file when there is one — generated notes
          # list every commit since the last tag (about 1,260 for 2.0.0).
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then body=(--notes-file "$notes"); else body=(--generate-notes); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
            gh release edit "$GITHUB_REF_NAME" "$kind"
          else
            gh release create "$GITHUB_REF_NAME" $files "$kind" "${body[@]}"
          fi

  # Selects which images publish-docker builds. A job-level `if` cannot see the
  # `matrix` context, so the `images` dispatch input is applied by building the
  # matrix here instead — a deselected image produces no job at all.
  plan-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        run: |
          ALL='[
            {"file":"Dockerfile",        "image":"synapse-ai",           "scope":"combined"},
            {"file":"Dockerfile.worker", "image":"synapse-ai-worker",    "scope":"worker"},
            {"file":"Dockerfile.backend","image":"synapse-ai-api-server","scope":"api-server"}
          ]'
          SEL="${{ inputs.images || 'all' }}"
          if [ "$SEL" = "all" ]; then
            SELECTED=$(jq -c . <<<"$ALL")
          else
            SELECTED=$(jq -c --arg s "$SEL" '[.[] | select(.scope==$s)]' <<<"$ALL")
          fi
          echo "Publishing: $(jq -r '[.[].image] | join(", ")' <<<"$SELECTED")"
          echo "matrix=$SELECTED" >> $GITHUB_OUTPUT

  # One job per image. Splitting by IMAGE, not by platform — each job still builds
  # both arches in a single buildx run and pushes one multi-arch manifest list, so
  # no `imagetools create` merge step is needed. The split buys parallelism (~70min
  # of sequential builds → the slowest single image) and, more importantly, failure
  # isolation: a broken image can be re-run on its own instead of rebuilding all three.
  publish-docker:
    runs-on: ubuntu-latest
    needs: [gate, plan-images]
    # An image takes ~30 min (1.9.1: 26, 1.9.2's re-run: 28); 1.9.2's first build
    # hung in "Build and push" for 4 h under the default 6-hour limit (F828).
    timeout-minutes: 90
    strategy:
      fail-fast: false  # two images already pushed must not be cancelled by the third
      matrix:
        include: ${{ fromJSON(needs.plan-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          # `:latest` is the last final release; a pre-release gets its version tag
          # only (the empty line is dropped).
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.gate.outputs.docker }}
            ${{ needs.gate.outputs.prerelease != 'true' && format('{0}/{1}:latest', secrets.DOCKERHUB_USERNAME, matrix.image) || '' }}
          # Read the per-image cache docker-build.yml warms on master. Scoped because
          # an unscoped `type=gha` puts all three images in one index, which is both
          # useless (api-server is a different Python base than the other two, so it
          # got 0 cache hits) and dangerous: each export rewrote an index the others
          # referenced, and in v1.8.4 that raced cache eviction and killed the release
          # with `failed to solve: not_found` — after the image had already been built.
          #
          # Deliberately no cache-to. Releases are 1-2 weeks apart and GHA evicts after
          # 7 days, so the export never paid off: across the whole v1.8.4 job it bought
          # 2 cache hits while burning multi-GB of the 10GB repo quota, evicting the CI
          # caches that are used daily, and putting a failure mode in the push path.
          cache-from: type=gha,scope=${{ matrix.scope }}
