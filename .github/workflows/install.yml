name: Install matrix

# Validates every packaging / installation path so a release can't ship a broken
# install: PyPI (wheel + sdist across Python versions), npm (bin + files + no
# stray bytecode), docker-compose config for all profiles, and the setup scripts.
# The heavy Docker image builds live in docker-build.yml; a full container/npm
# bring-up runs in nightly.yml.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PyPI / pip ──────────────────────────────────────────────────────────────
  pip-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build wheel + sdist (stub the frontend bundle)
        run: |
          mkdir -p synapse/_frontend && touch synapse/_frontend/.keep
          pip install hatch
          hatch build

      - name: Install the WHEEL in a clean venv and run the CLI
        # --no-deps keeps this a fast packaging/entry-point check; the full
        # dependency resolution across this Python matrix is covered by the
        # backend-tests job in ci.yml (which installs backend/requirements.txt).
        run: |
          python -m venv /tmp/whl
          /tmp/whl/bin/pip install --upgrade pip
          /tmp/whl/bin/pip install --no-deps dist/*.whl
          /tmp/whl/bin/synapse --help
          /tmp/whl/bin/python -c "import synapse.cli; assert callable(synapse.cli.main)"

      - name: Install the SDIST in a clean venv and run the CLI
        run: |
          python -m venv /tmp/sdist
          /tmp/sdist/bin/pip install --upgrade pip
          /tmp/sdist/bin/pip install --no-deps dist/*.tar.gz
          /tmp/sdist/bin/synapse --help

      - name: Assert the lockfiles are packaged
        # The CLI installs backend/requirements.lock. If the wheel doesn't ship
        # it, every packaged install silently falls back to unlocked resolution —
        # which is the failure mode this whole change exists to prevent.
        run: |
          python -m zipfile -l dist/*.whl > /tmp/wheel-contents.txt
          for f in backend/requirements.lock backend/requirements-messaging.lock; do
            grep -q "$f" /tmp/wheel-contents.txt \
              || { echo "::error::wheel is missing $f"; exit 1; }
          done
          echo "Lockfiles present in the wheel."

  # ── real dependency resolution ──────────────────────────────────────────────
  # The job above uses --no-deps, so it validates packaging but is structurally
  # incapable of catching a dependency break. This one actually resolves and
  # installs, then boots every MCP tool server — the check that would have caught
  # mcp 2.0.0 before it reached users.
  pip-install-with-deps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    continue-on-error: ${{ matrix.python-version != '3.11' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the locked dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock -r backend/requirements-messaging.lock
          pip install -r backend/requirements-test.txt

      - name: Boot every MCP tool server, and import every backend module
        # test_backend_imports is here for the Python it runs on: 3.14 evaluates
        # annotations lazily, so a module that cannot import on 3.11–3.13 passes
        # every test a 3.14 venv runs (F308).
        run: |
          python -m pytest \
            backend/tests/install/test_mcp_tool_servers.py \
            backend/tests/install/test_mcp_sdk_contract.py \
            backend/tests/install/test_requirements_pinned.py \
            backend/tests/install/test_backend_imports.py \
            -v -ra

  # ── npm ─────────────────────────────────────────────────────────────────────
  npm-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check the launcher
        run: node --check bin/synapse.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pack the npm package
        run: |
          npm run build
          npm pack

      - name: The package is the launcher and the installer, nothing else
        run: |
          tgz=$(ls synapse-orch-ai-*.tgz)
          echo "Packed: $tgz"
          tar tzf "$tgz" | sort
          for f in package/bin/synapse.js package/installer/synapse-install.pyz package/package.json; do
            tar tzf "$tgz" | grep -qx "$f" || { echo "::error::missing $f in npm tarball"; exit 1; }
          done
          if tar tzf "$tgz" | grep -E '^package/(backend|frontend-build|scripts)/'; then
            echo "::error::the npm package ships its own backend or frontend again"; exit 1
          fi

      - name: Global install links `synapse`, which answers --version without installing
        run: |
          npm install -g ./synapse-orch-ai-*.tgz
          command -v synapse
          test "$(synapse --version)" = "synapse $(node -p "require('./package.json').version")"
          test ! -e "$HOME/.synapse/install.json"

  # ── docker-compose ──────────────────────────────────────────────────────────
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide a .env file for compose (git-ignored)
        run: cp .env.docker .env 2>/dev/null || touch .env
      - name: Validate docker-compose (all profiles)
        run: |
          docker compose config --quiet
          docker compose --profile scale config --quiet

  # ── setup scripts ───────────────────────────────────────────────────────────
  setup-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Shell + Python setup-script syntax
        run: |
          bash -n setup.sh
          bash -n start.sh
          python -m py_compile setup.py
      - name: Parse the PowerShell installer
        shell: pwsh
        run: |
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/setup.ps1", [ref]$null, [ref]$null)
          Write-Host "setup.ps1 parses OK"
