[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-orch-ai"
version = "2.0.6"
description = "Synapse - A Multi Agent Orchestrator"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.15"
keywords = ["ai", "agent", "mcp", "llm", "orchestrator", "local", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# `pip install synapse-orch-ai` resolves from this list, not from
# backend/requirements.txt — so it needs the same upper bounds. A floor-only
# spec here is how mcp 2.0.0 reached users and broke every native tool server.
#
# mcp<2 is load-bearing: 2.0 removed the lowlevel Server decorator API that all
# of backend/tools/ depends on. See backend/requirements.txt for the full note,
# including what staying costs: MCP protocol 2026-07-28 is 2.x only (F175).
dependencies = [
    "cffi>=2.0.0,<3",
    # F1563: zoneinfo reads zones from this package where the computer has none (the python slim Docker images,
    # Windows); without it every schedule in a place's local time was refused there.
    # Its version is the data's year, not an API: the cap only keeps the house rule of an upper bound.
    "tzdata>=2026.3,<2030",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "google-api-python-client>=2.0,<3",
    "google-auth-oauthlib>=1.0,<2",
    "mcp>=1.29,<2",
    "chromadb>=0.5,<2",
    "ollama>=0.2,<1",
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.44,<2",
    # The web scraper (tools/web_scraper.py) drives Playwright itself: stealth on each context, pages read as
    # Markdown (F1157, in place of crawl4ai).
    "playwright-stealth>=2.0.3,<3",
    "html-to-markdown>=3.19,<4",
    "duckduckgo-search>=6.0,<9",
    "boto3>=1.34,<2",
    # The in-app browser's host and its client (core/browser). Already resolved through chromadb; named because
    # the engine imports it directly.
    "aiohttp>=3.14.4,<4",
    # The engine's store. `pip install` gets SQLite and needs nothing running;
    # asyncpg is only reached when SYNAPSE_DB_URL points at Postgres.
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.19,<1",
    "psycopg2-binary>=2.9,<3",
    "pymysql>=1.1,<2",
    "pypdf>=6.21.4,<7",
    "pdfplumber>=0.10,<1",
    "pandas>=2.0,<4",
    # Knowledge's vector leg (core/knowledge/index_sql.py). Already resolved through
    # pandas and chromadb; named because the engine imports it directly.
    "numpy>=1.26,<3",
    # Website logins' encryption (core/website_logins.py) and webhook signatures (core/messaging/verify.py). Already
    # resolved through google-auth and pyjwt; named because the engine imports it directly.
    "cryptography>=42,<51",
    "openpyxl>=3.1,<4",
    # Knowledge's parsers (A2, D162); see backend/requirements.txt.
    "pypdfium2>=4.30,<6",
    "pillow>=13.0,<14",
    "psutil>=5.9,<8",
    "defusedxml>=0.7,<1",
    "olefile>=0.46,<1",
    "requests>=2.31,<3",
    "anthropic>=0.28,<1",
    "psycopg[binary]>=3.0,<4",
    "psycopg-pool>=3.0,<4",
    "cocoindex>=0.3.30,<1.0",
    "python-telegram-bot>=20.0,<23",
    "discord.py>=2.3,<3",
    "slack-bolt>=1.18,<2",
    "pyyaml>=6.0,<7",
    # A cron schedule's next run (core/scheduler.py). Only requirements.txt
    # named it, so a pip install could not save a cron schedule (F161; its commit says F159).
    "croniter>=2.0,<7",
    # The CLI's tables, Markdown answers and chat spinner (synapse/client, D126).
    # Already resolved through cocoindex and mcp; named because the CLI
    # imports it directly.
    "rich>=13,<16",
]

[project.scripts]
synapse = "synapse.cli:main"
"synapse-ai" = "synapse.cli:main"

[project.urls]
Homepage = "https://synapseorch.com"
Documentation = "https://docs.synapseorch.com"
Repository = "https://github.com/synapseorch-ai/synapse-ai"
Issues = "https://github.com/synapseorch-ai/synapse-ai/issues"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
artifacts = [
    "synapse/_frontend/**",
]
include = [
    "synapse/",
    "backend/core/",
    "backend/services/",
    "backend/tools/",
    "backend/main.py",
    "backend/requirements.txt",
    "backend/requirements-coding.txt",
    "backend/requirements-messaging.txt",
    # The locks are what the CLI actually installs — without them shipped, a
    # packaged install silently falls back to unlocked resolution.
    "backend/requirements.lock",
    "backend/requirements-messaging.lock",
]

[project.optional-dependencies]
# Knowledge's optional parsers: Docling for PDFs (layout + TableFormer), HEIC
# photos for OCR. Same list as backend/requirements-knowledge.txt, whose header
# says how to fetch Docling's models and which system packages it needs.
knowledge = [
    "docling-slim[format-pdf,models-local,convert-core,cli]>=2.142,<3",
    "docling-core>=2.104,<3",
    "opencv-python-headless>=4.6,<5",
    "torch>=2.2.2,<3",
    "torchvision>=0.17,<1",
    "pillow-heif>=0.18,<2",
]
# OpenTelemetry export to an operator's own collector — off until they turn it
# on (backend/core/telemetry/config.py). Same list as
# backend/requirements-telemetry.txt.
telemetry = [
    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-asgi>=0.65b0,<1",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1",
    "opentelemetry-instrumentation-redis>=0.65b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
    "opentelemetry-exporter-prometheus>=0.65b0,<1",
    "prometheus-client>=0.19,<1",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-html>=4.0",
    "pytest-cov>=5.0",
    "fakeredis>=2.20",
    "httpx>=0.27",
]

[tool.coverage.run]
source = ["core"]
branch = false
# Omit modules that are inherently external/runtime and cannot be meaningfully
# unit-tested (they need a live ARQ worker, real Redis/Postgres, chat-platform
# bot connections, or spawned MCP/CLI subprocesses). These are exercised by the
# nightly integration job (.github/workflows/nightly.yml) instead.
#
# Four entries left this list rather than being maintained in it:
#   scale/sync.py                 deleted with the one-way JSON mirror (D30)
#   scale/worker.py               the job functions run under a real arq.worker
#   scale/worker_server_module.py .Worker on fakeredis in the fast suite now —
#                                 see tests/unit/test_shared_fleet.py
#   scheduler.py                  store-backed and unit-testable since Phase 6
#
# An omit that is wrong hides real coverage, and this list had been hiding the
# scheduler's 17% since it stopped being a filesystem poller.
omit = [
    "*/core/scale/worker_engine_adapter.py",
    "*/core/scale/telemetry.py",
    "*/core/scale/metrics.py",
    "*/core/scale/heartbeat.py",
    "*/core/scale/db.py",
    "*/core/scale/models_db.py",
    "*/core/messaging/*",
    "*/core/mcp_client.py",
    "*/core/mcp_oauth_state.py",
    "*/core/schedule_logger.py",
    "*/core/native_builder/*",
    "*/core/builder_tools.py",
    # Integration-only: app lifespan wiring, scale admin, chat-builder streaming,
    # vector memory (chromadb + embeddings), and AWS S3 — validated by the
    # nightly integration job and manual/e2e, not unit tests.
    "*/core/server.py",
    "*/core/routes/scale.py",
    "*/core/routes/builder.py",
    "*/core/memory.py",
    "*/core/s3_storage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "\\.\\.\\.",
    "except ImportError",
]

[tool.pytest.ini_options]
# Invoke from the repo root: `python -m pytest`
testpaths = ["backend/tests"]
asyncio_mode = "auto"
# The deploy gate runs the fast suite only; stress/integration are opt-in.
addopts = "-m 'not stress and not integration' -ra"
markers = [
    "stress: long-running load tests (5-90s fake-LLM latency); excluded from the gate",
    "integration: needs real Redis/Postgres/ARQ; run nightly, excluded from the gate",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.bandit]
targets = ["backend", "synapse"]
exclude_dirs = [
    "backend/venv",
    "backend/.venv",
    "backend/var",
    "backend/logs",
    "backend/chroma_db",
    "backend/tests",
]
skips = []

# The repo root's uv.lock (`uv sync`, `uv run`) installs exactly what the installer installs (F1173). The constraints
# are written by scripts/lock-deps.sh from backend/requirements-wheel-knowledge.lock and the base set's locks: do
