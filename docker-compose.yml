services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: synapse-backend
    env_file:
      - .env
    environment:
      # The database is deployment configuration. Compose runs its own Postgres
      # below, so the API and the worker read the same one — which is what lets
      # a job run in any process, and is the same shape every other deployment
      # of this uses.
      - SYNAPSE_DB_URL=postgresql+asyncpg://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@synapse-postgres:5432/${POSTGRES_DB:-synapse}
      - SYNAPSE_BLOB_DIR=/blobs
      # Scale mode is decided by this at startup. Empty = standalone. With
      # `--profile scale`, set REDIS_URL=redis://synapse-redis:6379/0 in .env so
      # the API enqueues to the workers that profile starts.
      - REDIS_URL=${REDIS_URL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host-gateway:11434}
      - CORS_ORIGINS=http://localhost:${SYNAPSE_FRONTEND_PORT:-3000}
      - SYNAPSE_INTERNAL_TOKEN=${SYNAPSE_INTERNAL_TOKEN}
      # Auto-generate + persist a shared internal token to the secrets volume so
      # the frontend can read the same value (see docker/entrypoint.sh).
      - SYNAPSE_SECRETS_DIR=/secrets
      # Where 1.x's compose kept its JSON (the ./backend/data bind below). Read
      # once, on the first boot: the importer brings it into the database and
      # moves the files into ./backend/data/migrated/. Nothing else reads it.
      - SYNAPSE_DATA_DIR=/legacy-data
    volumes:
      - synapse-blobs:/blobs
      - synapse-secrets:/secrets
      # The same host folder 1.x mounted, so upgrading needs no edit here.
      - ./backend/data:/legacy-data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bind to loopback by default: the frontend reaches the backend over the
      # compose network (synapse-backend:8765), and external API consumers use
      # the frontend port (http://host:3000/api/v1|v2/...). Publishing on
      # 0.0.0.0 would also expose the internal /api/* surface — safe now that the
      # token auto-generates, but off by default (GHSA-3j67-x3j8-r32x). To hit
      # the backend directly (e.g. bypass the Next hop for the open API), set
      # SYNAPSE_BACKEND_BIND=0.0.0.0 in .env.
      - "${SYNAPSE_BACKEND_BIND:-127.0.0.1}:${SYNAPSE_BACKEND_PORT:-8765}:8765"
    extra_hosts:
      - "host-gateway:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Backend boot connects several MCP servers before serving /docs; give it
      # grace so a slow-but-successful startup isn't marked unhealthy (which
      # aborts `docker compose up` via the frontend's service_healthy dep).
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_URL: http://synapse-backend:8765
    container_name: synapse-frontend
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://synapse-backend:8765
      - SYNAPSE_INTERNAL_TOKEN=${SYNAPSE_INTERNAL_TOKEN}
      # Read the shared internal token the backend wrote to the secrets volume.
      - SYNAPSE_SECRETS_DIR=/secrets
    volumes:
      - synapse-secrets:/secrets
    ports:
      - "${SYNAPSE_FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: synapse-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-synapse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-synapse}
      - POSTGRES_DB=${POSTGRES_DB:-synapse}
    volumes:
      - synapse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Backend and worker both wait on this. Without it they race the database
      # to accept connections and crash-loop through their restart policy until
      # it wins, which looks like a broken image rather than a slow start.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - default

  # ---------------------------------------------------------------------------
  # Scale profile services (not started in standalone mode)
  # Usage: docker compose --profile scale up
  # ---------------------------------------------------------------------------

  redis:
    image: redis:7-alpine
    profiles: [scale]
    container_name: synapse-redis
    # noeviction: Redis holds the job queue, and an LRU policy evicts queued
    # jobs under memory pressure. Full memory refuses new work instead.
    # Not published on the host: the API and workers reach it on the network.
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy noeviction
    volumes:
      - synapse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  worker:
    image: ${DOCKERHUB_USERNAME:-synapseorchai}/synapse-ai-worker:${SYNAPSE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
    profiles: [scale]
    # No container_name and no host port, so `--scale worker=N` works. The
    # Scale screen reaches each worker's health port over the network.
    # Longer than WORKER_JOB_COMPLETION_WAIT: on stop the worker lets running
    # jobs finish for that long, and Docker's default 10 s would kill it first.
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://synapse-redis:6379/0
      # The same database the API writes: that is what makes a shared fleet a
      # fleet rather than a set of processes each holding its own install. The
      # scale layer uses it too unless SCALE_POSTGRES_URL names another.
      - SYNAPSE_DB_URL=postgresql+asyncpg://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@synapse-postgres:5432/${POSTGRES_DB:-synapse}
      - SYNAPSE_BLOB_DIR=/blobs
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-10}
      - WORKER_JOB_TIMEOUT=${WORKER_JOB_TIMEOUT:-3600}
      - WORKER_MAX_RETRIES=${WORKER_MAX_RETRIES:-3}
      - WORKER_JOB_COMPLETION_WAIT=${WORKER_JOB_COMPLETION_WAIT:-45}
      - WORKER_HEALTH_PORT=9000
      # WORKER_FILESYSTEM_PATHS is deliberately unset. It used to be /data —
      # every tenant's config and credentials, handed to the Filesystem MCP
      # server. Unset, that server is rooted at the tenant's vault, which is
      # what it was always meant to expose.
      - PGBOUNCER_MODE=${PGBOUNCER_MODE:-0}
      - K8S_MODE=0
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=${S3_PREFIX:-synapse}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - OTLP_ENDPOINT=${OTLP_ENDPOINT:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
    volumes:
      # The same blob volume as the API, so a vaulted result written by one is
      # readable by the other. A real deployment uses S3 (the S3_* vars above)
      # and needs no shared filesystem at all.
      - synapse-blobs:/blobs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - default

volumes:
  # Was `synapse-data`, which had never held anything: a bind mount of
  # ./backend/data sat at the same /data and shadowed it in every service.
  synapse-blobs:
    driver: local
  synapse-postgres-data:
    driver: local
  synapse-secrets:
    driver: local
  synapse-redis-data:
    driver: local

networks:
  default:
    name: synapse-network
